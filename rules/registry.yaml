        article: "动态加载 Google Fonts 传输访客 IP，不能以正当利益为由"
        url: "https://www.gesetze-bayern.de/Content/Document/Y-300-Z-BECKRS-B-2022-N-612"
        verified_at: "2026-11-20"
      - law: "ICO 存储与访问技术指南"
