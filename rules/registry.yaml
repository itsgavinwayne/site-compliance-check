    check: auto
    basis:
      - law: "加州 CCPA"
        article: "§1798.120(a)；§1798.135(a)(1)–(3)"
        url: "https://cppa.ca.gov/pdf/20260101_ccpa_statute.pdf"
        verified_at: "2026-11-20"
      - law: "CCPA 实施条例"
        article: "11 CCR §7013"
        url: "https://cppa.ca.gov/regulations/pdf/ccpa_statute_eff_20260101.pdf"
        verified_at: "2026-11-20"
      - law: "CPPA 门槛调整公告"
        article: "2025-01-01 起年收入门槛 26,625,000 美元"
        url: "https://cppa.ca.gov/regulations/cpi_adjustment.html"
        verified_at: "2026-11-20"
    how_to_verify: >-
      先确认是否适用：企业达到 CCPA 门槛（年收入超过门槛、每年买卖/共享 10 万以上消费者或家庭的数据、或一半以上收入来自出售/共享数据之一），
      且出售或"共享"（跨情境行为广告）个人信息。适用时，首页应有"Do Not Sell or Share My Personal Information"链接
      （或 §1798.135(a)(3) 允许的合并链接），点开能直接提交退出请求，即通过。
    notes: >-
      §1798.135(b) 允许企业改为完全依靠退出偏好信号（GPC）处理退出请求而不放链接，此时本条可判"不适用"，但须通过 C-10。
      门槛每逢奇数年按 CPI 调整，2027-01-01 可能再调。

