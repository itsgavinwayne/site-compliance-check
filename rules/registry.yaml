  # ---------- F 表单与营销 ----------
  - id: F-01
    category: forms
    missing: 收集个人信息的表单旁没有隐私政策链接
    markets: [GLOBAL]
    level: must
    check: auto
    basis:
      - law: "GDPR"
        article: "第 13(1) 条（在收集时告知）；第 12(1) 条"
        url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
        verified_at: "2026-11-20"
      - law: "《个人信息保护法》"
        article: "第 17 条（处理前告知）"
        url: "https://www.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_04a0f1fb5df244e39688fd5372623a8d.html"
        verified_at: "2026-11-20"
      - law: "加州 CCPA / 实施条例"
        article: "§1798.100(a)；11 CCR §7012（收集时或之前告知）"
        url: "https://cppa.ca.gov/regulations/pdf/ccpa_statute_eff_20260101.pdf"
        verified_at: "2026-11-20"
    how_to_verify: >-
      所有收集姓名、邮箱、电话等的表单（联系、询价、订阅、注册），在提交按钮附近应有指向隐私政策的链接或简短告知。
      链接可点开，即通过；表单附近什么都没有，判不通过。
    notes: "GLOBAL 依据是\"收集时告知\"原则；CCPA 的收集时告知只约束达到门槛的企业。"

  - id: F-02
    category: forms
