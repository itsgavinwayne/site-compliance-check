        url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62017CJ0673"
        verified_at: "2026-11-20"
      - law: "EDPB Cookie 横幅工作组报告"
        article: "Type B：预勾选框"
        url: "https://www.edpb.europa.eu/system/files/2023-01/edpb_20230118_report_cookie_banner_taskforce_en.pdf"
        verified_at: "2026-11-20"
      - law: "ICO 存储与访问技术指南"
        article: "非豁免项须默认关闭"
        url: "https://ico.org.uk/for-organisations/direct-marketing-and-privacy-and-electronic-communications/guidance-on-the-use-of-storage-and-access-technologies/how-do-we-manage-consent-in-practice/"
        verified_at: "2026-11-20"
    how_to_verify: >-
      打开横幅的"设置/偏好"层：除"严格必要"外，统计、营销等类别都应默认关闭，且可以分别开关。
      有类别默认打开，或只有"全部接受/全部拒绝"、没有分类选项，判不通过。
    notes: "\"按类别选择\"的依据是同意须具体（GDPR 第 4(11) 条），且鉴于条款第 32 条要求处理有多个目的时逐一取得同意。"

  - id: C-05
    category: cookies
