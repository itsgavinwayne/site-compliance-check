        verified_at: "2026-11-20"
    how_to_verify: >-
      表单中的"接收营销邮件/订阅资讯"复选框应默认不勾选、可选填；不勾选也能提交表单（如询价、下单）。
      默认已勾选，或只有勾选营销才能提交，或用一句"提交即同意接收营销信息"代替复选框，判不通过。
    notes: >-
      "软性同意"例外：已在销售或洽谈中取得客户邮箱、推广自家同类产品，并在收集时和每封邮件中提供退订，可不经事先同意（ePrivacy 第 13(2) 条、PECR reg 22）。
      UK 自 2026-02-05 起对慈善机构也有类似例外。

