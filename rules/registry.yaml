  # ---------- A 无障碍 ----------
  - id: A-01
    category: accessibility
    missing: 未达到 WCAG 2.1 AA
    markets: [EU, US]
    level: conditional
    condition: 欧盟 EAA 范围内（电商、面向消费者的服务）为必须；美国 ADA 有诉讼风险
    check: hybrid
    basis:
      - law: "欧洲无障碍法案（指令 (EU) 2019/882）"
        article: "第 2(2)(f) 条（电子商务服务）；第 4(5) 条（微型企业豁免）；第 31(2) 条（2025-06-28 起适用）"
        url: "https://eur-lex.europa.eu/eli/dir/2019/882/oj/eng"
        verified_at: "2026-11-20"
      - law: "委员会实施决定 (EU) 2021/1339（EN 301 549 V3.2.1 协调标准）"
        article: "全文"
        url: "https://eur-lex.europa.eu/eli/dec_impl/2021/1339/oj"
        verified_at: "2026-11-20"
      - law: "ETSI EN 301 549 V3.2.1"
        article: "第 9.0 条（符合 WCAG 2.1 AA 等同于满足第 9.1–9.4、9.6 条）"
        url: "https://www.etsi.org/deliver/etsi_en/301500_301599/301549/03.02.01_60/en_301549v030201p.pdf"
        verified_at: "2026-11-20"
      - law: "美国司法部《Guidance on Web Accessibility and the ADA》（2022-03-18）"
        article: "第三章（面向公众的企业）网站须无障碍，做法可灵活"
        url: "https://www.ada.gov/resources/web-guidance/"
        verified_at: "2026-11-20"
    how_to_verify: >-
      用 axe-core 等工具跑一遍（自动只能发现一部分问题），再人工抽查：键盘能否完成主要流程（导航、表单、结账）、焦点可见、
      图片有替代文本、颜色对比度达标、表单有标签和错误提示、屏幕阅读器能读出关键内容。主要流程有阻断性问题判不通过。
    notes: >-
      美国没有针对私营企业网站的技术标准法规；28 CFR §35.200 的 WCAG 2.1 AA 要求只适用于州和地方政府
      （https://www.ecfr.gov/current/title-28/chapter-I/part-35/subpart-H/section-35.200，合规期限 2027-04-26 / 2028-04-26），这里只作参照。
      EN 301 549 V4.1.1（以 WCAG 2.2 为基线）据报 2026-09 发布、预计 2026-12 在官方公报引用，日期待核实；引用后本条可能要改为 WCAG 2.2 AA。

  - id: A-02
    category: accessibility
    missing: 没有无障碍声明
    markets: [EU]
    level: conditional
    condition: 属于欧盟 EAA 范围
    check: auto
    basis:
      - law: "欧洲无障碍法案（指令 (EU) 2019/882）"
        article: "第 13(2) 条及附件 V（在一般条款或同等文件中说明服务如何满足无障碍要求）"
        url: "https://eur-lex.europa.eu/eli/dir/2019/882/oj/eng"
        verified_at: "2026-11-20"
    how_to_verify: >-
      能在网站上找到无障碍信息（独立的"无障碍声明"页，或一般条款中的专门章节），说明服务如何满足无障碍要求，并在服务运营期间持续可查，即通过。
    notes: >-
      EAA 并不要求叫"无障碍声明"，只要求在一般条款或同等文件中公开相关信息，扫描器找不到"Accessibility statement"链接时需人工看条款。
      固定格式的"无障碍声明"（指令 (EU) 2016/2102 第 7 条）只适用于公共部门网站。
      提供服务的微型企业（第 3(23) 条：少于 10 人，且年营业额或资产负债表总额不超过 200 万欧元）可豁免（第 4(5) 条）。

