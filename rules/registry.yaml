      - law: "ICO 适龄设计规范（Children's code）"
        article: "适用于可能被儿童访问的线上服务"
        url: "https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/childrens-information/childrens-code-guidance-and-resources/age-appropriate-design-a-code-of-practice-for-online-services/"
        verified_at: "2026-11-20"
      - law: "《个人信息保护法》"
        article: "第 28、31 条"
        url: "https://www.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_04a0f1fb5df244e39688fd5372623a8d.html"
        verified_at: "2026-11-20"
      - law: "《儿童个人信息网络保护规定》（网信办令第 4 号）"
        article: "第 8、9、10 条"
        url: "https://www.cac.gov.cn/2019-08/23/c_1124913903.htm"
        verified_at: "2026-11-20"
      - law: "韩国《个人信息保护法》"
        article: "第 22 条之 2"
        url: "https://www.law.go.kr/법령/개인정보보호법"
        verified_at: "2026-11-20"
    how_to_verify: >-
      先判断是否面向儿童（内容、画风、受众）或注册时是否收集年龄/生日。适用时检查：
      ①收集儿童信息前有监护人同意流程（US 须为"可验证"的家长同意）；②有专门的儿童隐私规则（CN 第 31 条、网信办令第 4 号第 8 条）或面向儿童的告知；
      ③有年龄门槛时，未达年龄的用户无法绕过直接提交。缺任一项判不通过。
    notes: >-
      新增条目（S1）。COPPA 2025 年修订自 2025-06-23 生效，多数条款须于 2026-04-22 前合规
      （https://www.federalregister.gov/documents/2025/04/22/2025-05904/childrens-online-privacy-protection-rule）。
      UK 第 8 条的年龄自 2026-04-29 起可由国务大臣以条例在 13–16 岁之间调整，目前仍为 13 岁。

