# 规则登记表 — 扫描器、文档、skill 共用的唯一来源。字段说明见 SCHEMA.md
# basis 为空 = 依据尚未核实（工作流 S1 负责填写）
version: 0.0.1
rules:
  # ---------- P 隐私政策 ----------
  - id: P-01
    category: privacy-policy
    missing: 没有隐私政策，或页脚点不到
    markets: [GLOBAL]
    level: must
    check: auto
    basis:
      - law: "GDPR（条例 (EU) 2016/679）"
        article: "第 12(1) 条、第 13 条"
        url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
        verified_at: "2026-11-20"
      - law: "UK GDPR"
        article: "第 13 条"
        url: "https://www.legislation.gov.uk/eur/2016/679/article/13"
        verified_at: "2026-11-20"
      - law: "《个人信息保护法》"
        article: "第 7 条、第 17 条"
        url: "https://www.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_04a0f1fb5df244e39688fd5372623a8d.html"
        verified_at: "2026-11-20"
      - law: "加州 CCPA（Cal. Civ. Code §1798.130）"
        article: "§1798.130(a)(5)"
        url: "https://cppa.ca.gov/pdf/20260101_ccpa_statute.pdf"
        verified_at: "2026-11-20"
      - law: "加拿大 PIPEDA 附表 1"
        article: "原则 4.8（Openness）"
        url: "https://laws-lois.justice.gc.ca/eng/acts/P-8.6/page-7.html"
        verified_at: "2026-11-20"
      - law: "韩国《个人信息保护法》"
        article: "第 30 条"
        url: "https://www.law.go.kr/법령/개인정보보호법"
        verified_at: "2026-11-20"
    how_to_verify: >-
      从首页（含页脚）能找到"隐私政策/Privacy Policy/Datenschutz"等链接，点开返回 200 且是隐私政策正文，即通过。
      找不到链接、链接 404、只有一句话或只在注册流程里才能看到，判不通过。
    notes: >-
      GLOBAL 指主要市场普遍要求公开处理规则。加州 CalOPPA（Bus. & Prof. Code §22575）也要求商业网站显著张贴隐私政策，
      但官方 leginfo 站点 2026-11-20 拦截自动访问，条文待核实，暂未列入 basis。

  - id: P-02
    category: privacy-policy
    missing: 隐私政策未说明收集哪些数据、用途、法律依据、保存期限
    markets: [EU, UK, CN, KR]
    level: must
    check: manual
    basis:
      - law: "GDPR"
        article: "第 13(1)(c)、13(2)(a) 条；第 14 条"
        url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
        verified_at: "2026-11-20"
      - law: "UK GDPR"
        article: "第 13 条"
        url: "https://www.legislation.gov.uk/eur/2016/679/article/13"
        verified_at: "2026-11-20"
      - law: "《个人信息保护法》"
        article: "第 17 条"
        url: "https://www.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_04a0f1fb5df244e39688fd5372623a8d.html"
        verified_at: "2026-11-20"
      - law: "《网络数据安全管理条例》（国务院令第 790 号）"
        article: "第 21 条"
        url: "https://www.gov.cn/gongbao/2024/issue_11646/202410/content_6980863.html"
        verified_at: "2026-11-20"
      - law: "韩国《个人信息保护法》及施行令"
        article: "法第 30 条；施行令第 31 条"
        url: "https://www.law.go.kr/법령/개인정보보호법"
        verified_at: "2026-11-20"
    how_to_verify: >-
      逐项核对隐私政策：①收集的数据类别；②每类数据的用途；③法律依据（EU/UK 需写明 GDPR 第 6 条中的哪一项，
      如同意、合同、正当利益）；④保存期限或确定期限的标准。四项都有、且与网站实际收集的数据对得上即通过；缺任一项不通过。
    notes: >-
      CN 不要求写"法律依据"，但须写处理目的、方式、种类、保存期限及权利行使方式。
      加州 CCPA §1798.100(a)(3) 也要求说明保存期限，但只适用于达到门槛的企业，因此未把 US 列入本条市场。

  - id: P-03
    category: privacy-policy
    missing: 未列出接收数据的第三方（统计、CRM、邮件服务等）
    markets: [EU, UK, CN, US, KR, CH]
    level: must
    check: manual
    basis:
      - law: "GDPR"
        article: "第 13(1)(e) 条（接收方或接收方类别）"
        url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
        verified_at: "2026-11-20"
      - law: "UK GDPR"
        article: "第 13 条"
        url: "https://www.legislation.gov.uk/eur/2016/679/article/13"
        verified_at: "2026-11-20"
      - law: "《个人信息保护法》"
        article: "第 23 条（向其他处理者提供须告知接收方并单独同意）"
        url: "https://www.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_04a0f1fb5df244e39688fd5372623a8d.html"
        verified_at: "2026-11-20"
      - law: "加州 CCPA"
        article: "§1798.130(a)(5)(B)(iv)"
        url: "https://cppa.ca.gov/pdf/20260101_ccpa_statute.pdf"
        verified_at: "2026-11-20"
      - law: "韩国《个人信息保护法》"
        article: "第 30 条（第三方提供、委托处理事项）"
        url: "https://www.law.go.kr/법령/개인정보보호법"
        verified_at: "2026-11-20"
      - law: "瑞士 nDSG（SR 235.1）"
        article: "第 19 条第 2 款（接收方或接收方类别）"
        url: "https://www.fedlex.admin.ch/eli/cc/2022/491/de"
        verified_at: "2026-11-20"
    how_to_verify: >-
      对照扫描器列出的第三方域名（统计、广告、客服、CRM、邮件、CDN 字体等），检查隐私政策是否写明接收方名称或至少写明类别。
      网站实际在用、政策里没有覆盖的第三方，判不通过。CN 须写明接收方名称和联系方式（个保法第 23 条），只写类别不够。
    notes: >-
      US 部分：CCPA 只约束达到 §1798.140(d) 门槛的企业（2025 年起年收入门槛 26,625,000 美元，
      见 https://cppa.ca.gov/regulations/cpi_adjustment.html）。CalOPPA 也要求列出第三方类别，但条文待核实（官方站点拦截自动访问）。

  - id: P-04
    category: privacy-policy
    missing: 未说明数据跨境传输
    markets: [EU, UK, CN, KR, CH]
    level: must
    check: manual
    basis:
      - law: "GDPR"
        article: "第 13(1)(f) 条；第五章第 44–49 条"
        url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
        verified_at: "2026-11-20"
      - law: "UK GDPR（经 Data (Use and Access) Act 2025 修订）"
        article: "第 13 条；第 44A、45A、46 条（数据保护测试）"
        url: "https://www.legislation.gov.uk/eur/2016/679/article/46"
        verified_at: "2026-11-20"
      - law: "《个人信息保护法》"
        article: "第 38、39 条"
        url: "https://www.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_04a0f1fb5df244e39688fd5372623a8d.html"
        verified_at: "2026-11-20"
      - law: "韩国《个人信息保护法施行令》"
        article: "第 31 条第 1 款（跨境转移依据）"
        url: "https://www.law.go.kr/법령/개인정보보호법시행령"
        verified_at: "2026-11-20"
      - law: "瑞士 nDSG（SR 235.1）"
        article: "第 19 条第 4 款（目的国及保障措施或例外依据）"
        url: "https://www.fedlex.admin.ch/eli/cc/2022/491/de"
        verified_at: "2026-11-20"
    how_to_verify: >-
      网站用到的服务（托管、统计、CRM、邮件等）有服务器在境外时，隐私政策应写明：传往哪些国家/地区、接收方是谁、
      依据什么机制（EU：充分性决定或标准合同条款等；CN：安全评估、标准合同或认证；CH：须列出目的国）。
      确实不出境的，政策写明这一点也算通过。存在出境却只字未提，判不通过。
    notes: >-
      CN 出境的数量门槛与申报义务见《促进和规范数据跨境流动规定》（https://www.cac.gov.cn/2024-03/22/c_1712776611775634.htm，核实 2026-11-20）；
      出境单独同意另见 CN-04。

  - id: P-05
    category: privacy-policy
    missing: 未说明用户如何查阅、更正、删除个人数据
    markets: [EU, UK, US, CN, KR, CA]
    level: must
    check: manual
    basis:
      - law: "GDPR"
        article: "第 13(2)(b) 条；第 15–17 条"
        url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
        verified_at: "2026-11-20"
      - law: "UK GDPR"
        article: "第 13、15、17 条"
        url: "https://www.legislation.gov.uk/eur/2016/679/article/17"
        verified_at: "2026-11-20"
      - law: "加州 CCPA"
        article: "§1798.105、§1798.106、§1798.110；§1798.130(a)(5)(A)（至少两种提交请求的方式）"
        url: "https://cppa.ca.gov/pdf/20260101_ccpa_statute.pdf"
        verified_at: "2026-11-20"
      - law: "《个人信息保护法》"
        article: "第 17 条；第 45–47 条；第 50 条"
        url: "https://www.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_04a0f1fb5df244e39688fd5372623a8d.html"
        verified_at: "2026-11-20"
      - law: "韩国《个人信息保护法》"
        article: "第 30 条（权利及行使方法）"
        url: "https://www.law.go.kr/법령/개인정보보호법"
        verified_at: "2026-11-20"
      - law: "加拿大 PIPEDA 附表 1"
        article: "原则 4.8.2（获取个人信息的方式）"
        url: "https://laws-lois.justice.gc.ca/eng/acts/P-8.6/page-7.html"
        verified_at: "2026-11-20"
    how_to_verify: >-
      隐私政策须写明用户有哪些权利（至少包括查阅、更正、删除），以及具体怎么提出（邮箱、表单、电话等可用渠道）。
      只列权利不给渠道，或渠道失效（邮箱退信、表单 404），判不通过。US（CCPA 适用时）须提供至少两种提交方式。
    notes: >-
      US 部分只在达到 CCPA 门槛时为必须（见 P-03 备注）；其他州的隐私法未逐一核实。
      个保法第 44 条是知情权、决定权；查阅复制、更正、删除分别在第 45、46、47 条。

  - id: P-06
    category: privacy-policy
    missing: 隐私政策内容与网站实际使用的工具不一致
    markets: [GLOBAL]
    level: must
    check: manual
    basis:
      - law: "GDPR"
        article: "第 5(1)(a) 条（透明）；第 5(2) 条（问责）"
        url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
        verified_at: "2026-11-20"
      - law: "《个人信息保护法》"
        article: "第 7 条（公开透明）"
        url: "https://www.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_04a0f1fb5df244e39688fd5372623a8d.html"
        verified_at: "2026-11-20"
      - law: "加州 CCPA"
        article: "§1798.130(a)(5)（每 12 个月至少更新一次）"
        url: "https://cppa.ca.gov/pdf/20260101_ccpa_statute.pdf"
        verified_at: "2026-11-20"
    how_to_verify: >-
      把扫描器记录的第三方请求、Cookie 和表单字段，与隐私政策逐项比对：实际在用的工具、收集的字段都在政策里有对应描述，即通过；
      有遗漏（比如政策没提 Hotjar，网站却在加载），或政策写了"不使用 Cookie"实际却在用，判不通过。
    notes: "依据是透明原则的一般要求；各法没有一条专门写\"必须一致\"，但不一致即构成告知不实。"

  - id: P-07
    category: privacy-policy
    missing: 没有中文版隐私政策
    markets: [CN]
    level: recommended
    check: hybrid
    basis:
      - law: "《个人信息保护法》"
        article: "第 17 条（以显著方式、清晰易懂的语言告知）"
        url: "https://www.miit.gov.cn/zwgk/zcwj/flfg/art/2022/art_04a0f1fb5df244e39688fd5372623a8d.html"
        verified_at: "2026-11-20"
      - law: "《App 违法违规收集使用个人信息行为认定方法》（国信办秘字〔2019〕191 号）"
        article: "第一部分第 4 项（未提供简体中文版视为难以阅读）"
        url: "https://www.cac.gov.cn/2019-12/27/c_1578986455686625.htm"
        verified_at: "2026-11-20"
    how_to_verify: >-
      面向中国大陆用户的网站，能找到简体中文的隐私政策全文（不是机翻摘要），内容与其他语言版本一致，即通过。
    notes: >-
      级别由 must 调为 recommended：没有找到要求"网站"隐私政策必须有中文版的法律或法规条款。
      明确写到"简体中文版"的官方文件只有上面的 App 认定方法，只适用于 App，且属规范性文件。
      对网站只能从个保法第 17 条"清晰易懂的语言"推导。GB/T 35273-2020 未能取得全文，待核实。

  - id: P-08
    category: privacy-policy
    missing: 隐私政策没有更新日期
    markets: [US, EU]
    level: recommended
    check: hybrid
    basis:
      - law: "加州 CCPA 实施条例（11 CCR §7011）"
        article: "§7011（隐私政策须写明最后更新日期）"
        url: "https://cppa.ca.gov/regulations/pdf/ccpa_statute_eff_20260101.pdf"
        verified_at: "2026-11-20"
      - law: "加州 CCPA"
        article: "§1798.130(a)(5)（每 12 个月至少更新一次）"
        url: "https://cppa.ca.gov/pdf/20260101_ccpa_statute.pdf"
        verified_at: "2026-11-20"
    how_to_verify: "隐私政策页面写有\"最后更新/生效日期\"，即通过；没有日期，或日期早于 12 个月且网站工具已变，判不通过。"
    notes: >-
      达到 CCPA 门槛的企业，写明日期是法定义务；EU 无明文要求，属透明原则下的惯例。
      CalOPPA §22575(b) 据称也要求写生效日期，但官方条文待核实（leginfo 拦截自动访问）。

  # ---------- C Cookie 与追踪 ----------
  - id: C-01
    category: cookies
    missing: 没有 Cookie 同意横幅
    markets: [EU, UK]
    level: must
    check: auto
    basis:
      - law: "ePrivacy 指令 2002/58/EC（2009/136/EC 修订）"
        article: "第 5(3) 条"
        url: "https://eur-lex.europa.eu/eli/dir/2002/58/2009-12-19/eng"
        verified_at: "2026-11-20"
      - law: "德国 TDDDG（原 TTDSG）"
        article: "§25"
        url: "https://www.gesetze-im-internet.de/ttdsg/__25.html"
        verified_at: "2026-11-20"
      - law: "英国 PECR（经 Data (Use and Access) Act 2025 第 112 条替换）"
        article: "reg 6；附表 A1（例外）"
        url: "https://www.legislation.gov.uk/ukpga/2025/18/section/112"
        verified_at: "2026-11-20"
      - law: "ICO 存储与访问技术指南"
        article: "How do we manage consent in practice?"
        url: "https://ico.org.uk/for-organisations/direct-marketing-and-privacy-and-electronic-communications/guidance-on-the-use-of-storage-and-access-technologies/how-do-we-manage-consent-in-practice/"
        verified_at: "2026-11-20"
    how_to_verify: >-
      用无痕窗口首次打开网站：使用非必要 Cookie/追踪技术的，首屏应出现可操作的同意界面（接受、拒绝、设置）。
      网站确实只用严格必要的 Cookie，可以不弹横幅，此时判"不适用"。只有一行"继续浏览即同意"的提示条，判不通过。
    notes: >-
      UK：DUAA 2025 自 2026-02-05 起新增例外（统计分析、网站外观/功能），条件是清楚告知并提供简单免费的反对方式
      （附表 A1，https://www.legislation.gov.uk/ukpga/2025/18/schedule/12）。只用这类例外技术的 UK 网站可以不弹同意横幅，但仍须告知并提供反对方式；
      广告类追踪仍须事先同意。EU 的 Digital Omnibus 修改 Cookie 规则的提案截至 2026-10 尚未通过，ePrivacy 第 5(3) 条照常适用。

  - id: C-02
    category: cookies
    missing: 用户同意前已加载统计/广告类 Cookie 或脚本
    markets: [EU, UK]
    level: must
    check: auto
    basis:
      - law: "ePrivacy 指令 2002/58/EC"
        article: "第 5(3) 条"
        url: "https://eur-lex.europa.eu/eli/dir/2002/58/2009-12-19/eng"
        verified_at: "2026-11-20"
      - law: "GDPR"
        article: "第 6(1) 条；第 7 条"
        url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
        verified_at: "2026-11-20"
      - law: "英国 PECR reg 6 及附表 A1"
        article: "reg 6；附表 A1"
        url: "https://www.legislation.gov.uk/ukpga/2025/18/schedule/12"
        verified_at: "2026-11-20"
      - law: "ICO 存储与访问技术指南"
        article: "须事先取得同意；非豁免项默认关闭"
        url: "https://ico.org.uk/for-organisations/direct-marketing-and-privacy-and-electronic-communications/guidance-on-the-use-of-storage-and-access-technologies/how-do-we-manage-consent-in-practice/"
        verified_at: "2026-11-20"
      - law: "CNIL Cookie 指南与建议（délibérations 2020-091 / 2020-092）"
        article: "同意前不得写入需同意的追踪器"
        url: "https://www.cnil.fr/fr/cookies-et-autres-traceurs/regles/cookies/lignes-directrices-modificatives-et-recommandation"
        verified_at: "2026-11-20"
    how_to_verify: >-
      无痕窗口打开首页，不点任何按钮，等待加载完成后检查 Cookie、localStorage 和网络请求：
      出现 _ga、_gid、_fbp、广告/统计域名请求，判不通过；只有会话、负载均衡、安全、同意状态等严格必要项，判通过。
    notes: >-
      UK：DUAA 2025 附表 A1 允许统计分析类技术在满足条件时免于同意（自 2026-02-05 起），条件包括清楚告知、
      数据只用于改进服务、提供简单免费的反对方式。UK 网站同意前加载统计脚本时，要人工确认是否满足这些条件；广告类不在豁免内。

  - id: C-03
    category: cookies
    missing: 横幅没有拒绝按钮，或拒绝比接受更难操作
    markets: [EU, UK]
    level: must
    check: auto
    basis:
      - law: "GDPR"
        article: "第 4(11) 条、第 7 条（自由给予的同意）"
        url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
        verified_at: "2026-11-20"
      - law: "EDPB Cookie 横幅工作组报告（2023-01-18）"
        article: "Type A：有接受按钮的层级却没有拒绝选项"
        url: "https://www.edpb.europa.eu/system/files/2023-01/edpb_20230118_report_cookie_banner_taskforce_en.pdf"
        verified_at: "2026-11-20"
      - law: "CNIL Cookie 建议"
        article: "拒绝须与接受同样容易"
        url: "https://www.cnil.fr/fr/cookies-et-autres-traceurs/regles/cookies/lignes-directrices-modificatives-et-recommandation"
        verified_at: "2026-11-20"
      - law: "ICO 存储与访问技术指南"
        article: "拒绝须与接受同样容易、同样醒目"
        url: "https://ico.org.uk/for-organisations/direct-marketing-and-privacy-and-electronic-communications/guidance-on-the-use-of-storage-and-access-technologies/how-do-we-manage-consent-in-practice/"
        verified_at: "2026-11-20"
    how_to_verify: >-
      横幅第一层有"接受全部"时，同一层也应有"拒绝全部"（或同等含义），按钮大小、颜色、显眼程度相当，点击次数相同。
      只能在第二层才能拒绝，或拒绝只是一个灰色小字链接，判不通过。
    notes: >-
      EDPB 报告是各国监管机构的共同立场，不是有约束力的法律；报告称"绝大多数"机构认为缺少拒绝选项构成违规，
      并且针对的是"任何有接受按钮的层级"。CNIL 建议在法国属软法，有约束力的是法国《信息与自由法》第 82 条。

