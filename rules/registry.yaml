      隐私政策或网站上应写明负责人（DPO / 个人信息保护负责人 / 개인정보 보호책임자 / person in charge）的联系方式，
      至少有专用邮箱或表单（EU/UK 可不写姓名）；KR 须写负责人姓名或部门及联系方式。依法须指定却找不到联系方式，判不通过。
    notes: >-
      新增条目（S1），check 设为 manual，扫描器无需实现。魁北克法规（CQLR c P-39.1）原文在 legisquebec 无法访问，
      具体条号（据称第 3.1 条）待核实，实体义务以 CAI 指南为准。
      巴西 LGPD 第 41 条 §1（在网站公开 encarregado 身份和联系方式）原文在 planalto.gov.br 无法访问，待核实，暂未列入 BR 市场。

  - id: P-10
    category: privacy-policy
    missing: 隐私政策未说明可向运营方投诉及投诉途径
    markets: [UK]
    level: must
    check: manual
    basis:
      - law: "UK GDPR（经 Data (Use and Access) Act 2025 修订）"
        article: "第 13(2)(ca) 条（2026-06-19 起须告知可向控制者投诉）"
        url: "https://www.legislation.gov.uk/eur/2016/679/article/13"
        verified_at: "2026-11-20"
      - law: "Data (Use and Access) Act 2025"
        article: "第 103 条（新增 DPA 2018 第 164A 条：控制者须提供投诉途径，如电子表单，并在 30 天内确认收到）"
        url: "https://www.legislation.gov.uk/ukpga/2025/18/section/103"
        verified_at: "2026-11-20"
    how_to_verify: >-
      隐私政策应说明用户可以就个人数据处理向运营方投诉，并给出具体途径（如在线投诉表单、专用邮箱）；
      同时说明可以向英国监管机构投诉。只写"可向 ICO 投诉"、没有向运营方投诉的途径，判不通过。
    notes: >-
      新增条目（S1），check 设为 manual。英国监管机构自 2026-09-30 起更名为 Information Commission（SI 2026/386），
      隐私政策中仍写"ICO/Information Commissioner"的不算不通过，但建议更新。

  - id: C-11
    category: cookies
    missing: 未公示通过标签、SDK 向第三方发送的用户信息（日本外部送信规律）
    markets: [JP]
    level: conditional
    condition: 属于日本電気通信事業法外部送信規律的适用范围（如通过网站提供 SNS、搜索、新闻/策展类网络媒体等服务）
    check: manual
    basis:
      - law: "日本電気通信事業法"
        article: "第 27 条之 12"
        url: "https://laws.e-gov.go.jp/api/1/lawdata/359AC0000000086"
        verified_at: "2026-11-20"
      - law: "総務省「外部送信規律」说明页"
        article: "适用范围与公示事项（2023-06-16 施行）"
        url: "https://www.soumu.go.jp/main_sosiki/joho_tsusin/d_syohi/gaibusoushin_kiritsu.html"
        verified_at: "2026-11-20"
    how_to_verify: >-
      先判断是否在适用范围内（只卖自家商品的网店、普通企业官网、博客不在范围内）。适用时，网站应有日文的公示页面
      （常见名为"外部送信について"），列出：发送的信息种类、接收方名称、利用目的；用户易于到达（如页脚链接）。
      没有公示页，或公示内容与网站实际加载的第三方标签不符，判不通过。
    notes: "新增条目（S1），check 设为 manual。法条允许\"事先通知\"或\"使用户易于知悉\"两种方式；以弹窗等方式事先通知的，也算通过。"
