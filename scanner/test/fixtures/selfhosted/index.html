<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>示例小部件</title>
<script>
  // 虚构的自建统计：无 Cookie、无本地存储，用 sendBeacon 上报到清单外的端点
  window.addEventListener('load', function () {
    var body = JSON.stringify({ e: 'pageview', p: location.pathname });
    if (navigator.sendBeacon) navigator.sendBeacon('/functions/v1/analytics-ingest', new Blob([body], { type: 'text/plain' }));
  });
</script>
